
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascotas | PetMatch Mini</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

    <a class="skip-link" href="#contenido-principal">
        Saltar al contenido principal
    </a>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main id="contenido-principal">

        <h1>Mascotas del catálogo</h1>

        <p>
            Hay
            <strong th:text="${pets.size()}">0</strong>
            mascotas disponibles.
        </p>

        <a th:href="@{/pets/new}">Registrar nueva mascota</a>

        <ul>
            <li th:each="pet : ${pets}">

                <h2 th:text="${pet.name}">Nombre</h2>

                <p>
                    Especie:
                    <span th:text="${pet.species}"></span>
                </p>

                <p>
                    Edad:
                    <span th:text="${pet.age}"></span> años
                </p>

                <a th:href="@{/pets/{id}(id=${pet.id})}">
                    Ver detalles
                </a>

                <a th:href="@{/pets/{id}/edit(id=${pet.id})}">
                    Editar
                </a>

                <form th:action="@{/pets/{id}/delete(id=${pet.id})}"
                      method="post">

                    <button type="submit">
                        Eliminar
                    </button>

                </form>

            </li>
        </ul>

        <a th:href="@{/}">Volver al inicio</a>

    </main>

</body>
</html>
