
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle de mascota | PetMatch Mini</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

    <a class="skip-link" href="#contenido-principal">
        Saltar al contenido principal
    </a>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main id="contenido-principal">

        <h1>Información de la mascota</h1>

        <h2 th:text="${pet.name}">Nombre</h2>

        <p>
            <strong>Identificación:</strong>
            <span th:text="${pet.id}"></span>
        </p>

        <p>
            <strong>Especie:</strong>
            <span th:text="${pet.species}"></span>
        </p>

        <p>
            <strong>Edad:</strong>
            <span th:text="${pet.age}"></span> años
        </p>

        <p>
            <strong>Descripción:</strong>
            <span th:text="${pet.description}"></span>
        </p>

        <a th:href="@{/pets/{id}/edit(id=${pet.id})}">
            Editar mascota
        </a>

        <form th:action="@{/pets/{id}/delete(id=${pet.id})}"
              method="post">

            <button type="submit">
                Eliminar mascota
            </button>

        </form>

        <a th:href="@{/pets}">Volver al catálogo</a>

    </main>

</body>
</html>
